/* =========================================================================
   ARBRE — diagramme SVG avec branches
   ========================================================================= */
const TREE_NODE_W = 178, TREE_NODE_H = 60, TREE_GAP_X = 18, TREE_LEVEL_H = 104,
      TREE_PAD_X = 24, TREE_PAD_TOP = 20, TREE_FAMILY_GAP = 50, TREE_STEM = 20,
      TREE_ROW_GUTTER_W = 56;

// pathIds = chaîne des ancêtres du nœud courant, sur CE chemin précis (garde-fou
// contre une boucle de parrainage principal mal formée dans les données).
// Chaque personne n'apparaît désormais qu'UNE SEULE FOIS dans l'arbre, à sa position
// "principale" (son premier parrain valide) — les parrains supplémentaires sont
// affichés séparément comme des traits qui convergent vers cette même case
// (voir buildExtraLinks plus bas), au lieu de dupliquer la case elle-même.
function buildTreeWrapper(person, depth, pathIds){
  pathIds = pathIds || new Set();
  const nextPath = new Set(pathIds);
  nextPath.add(person.id);
  const realKids = primaryChildrenOf(person.id).filter(k => !nextPath.has(k.id));
  const collapsed = collapsedIds.has(person.id);
  return {
    person, depth,
    hasRealChildren: realKids.length > 0,
    realChildCount: realKids.length,
    collapsed,
    children: collapsed ? [] : realKids.map(k => buildTreeWrapper(k, depth+1, nextPath)),
  };
}
function measureTreeWidth(node){
  if(node.children.length === 0){ node._w = TREE_NODE_W + TREE_GAP_X; return node._w; }
  let w = 0;
  node.children.forEach(c => { w += measureTreeWidth(c); });
  node._w = Math.max(w, TREE_NODE_W + TREE_GAP_X);
  return node._w;
}
// Ne calcule QUE la position horizontale (x) ici. La position verticale (y) est
// affectée séparément après coup, en fonction de la promo effective de chacun
// (voir computeForestLayout) — pas de la profondeur de parrainage — pour que tout
// le monde d'une même promo (1A, 2A, 3A…) se retrouve sur la même ligne horizontale.
function assignTreeX(node, xStart){
  if(node.children.length === 0){
    node.x = xStart + node._w/2;
    return;
  }
  const sumChildW = node.children.reduce((a,c)=>a+c._w,0);
  let cursor = xStart + (node._w - sumChildW)/2;
  node.children.forEach(c => { assignTreeX(c, cursor); cursor += c._w; });
  node.x = (node.children[0].x + node.children[node.children.length-1].x)/2;
}
function flattenTree(node, arr){
  arr.push(node);
  node.children.forEach(c => flattenTree(c, arr));
}
// Remonte la chaîne des parrains PRINCIPAUX jusqu'à la racine de la famille de cette
// personne (le fondateur de sa branche).
function rootOf(person){
  let cur = person;
  let guard = 0;
  while(guard++ < 500){
    const pid = primaryParrainId(cur);
    if(!pid) return cur;
    const parent = findPerson(pid);
    if(!parent) return cur;
    cur = parent;
  }
  return cur;
}
// Réordonne les familles racines pour que deux familles reliées par un second
// parrainage (trait pointillé) se retrouvent voisines dans l'arbre, au lieu que le
// trait traverse tout le diagramme et le rende illisible. On ne touche pas à
// l'organisation interne de chaque famille, seulement l'ordre des colonnes.
function orderRootsForLayout(rts){
  if(rts.length <= 2) return rts;

  // Poids de connexion entre deux familles = nombre de parrainages secondaires
  // qui les relient.
  const weight = new Map();
  const addWeight = (a, b) => {
    if(a === b) return;
    const key = a < b ? a + "|" + b : b + "|" + a;
    weight.set(key, (weight.get(key) || 0) + 1);
  };
  visiblePeople().forEach(person => {
    const primary = primaryParrainId(person);
    validParrainIds(person).forEach(pid => {
      if(pid === primary) return;
      const parentPerson = findPerson(pid);
      if(!parentPerson) return;
      addWeight(rootOf(person).id, rootOf(parentPerson).id);
    });
  });
  if(weight.size === 0) return rts; // aucun lien inter-familles : ordre alphabétique inchangé

  const weightBetween = (a, b) => weight.get(a < b ? a + "|" + b : b + "|" + a) || 0;

  // Chaînage glouton : à chaque étape, on ajoute la famille restante la plus
  // connectée à la dernière placée ; à défaut de connexion, on garde l'ordre
  // alphabétique d'origine pour rester stable et prévisible.
  const remaining = rts.slice();
  const order = [];
  let startIdx = 0, bestDeg = -1;
  rts.forEach((r, i) => {
    let deg = 0;
    weight.forEach((w, key) => { const [a,b] = key.split("|"); if(a===r.id || b===r.id) deg += w; });
    if(deg > bestDeg){ bestDeg = deg; startIdx = i; }
  });
  order.push(remaining.splice(startIdx,1)[0]);

  while(remaining.length){
    const last = order[order.length-1];
    let bestI = -1, bestW = -1;
    remaining.forEach((r, i) => {
      const w = weightBetween(last.id, r.id);
      if(w > bestW){ bestW = w; bestI = i; }
    });
    if(bestW <= 0) bestI = 0; // pas de lien : on avance dans l'ordre alphabétique restant
    order.push(remaining.splice(bestI,1)[0]);
  }
  return order;
}
function computeForestLayout(){
  const rts = orderRootsForLayout(roots());
  let cursorX = TREE_PAD_X + TREE_ROW_GUTTER_W;
  const allNodes = [];
  rts.forEach(person => {
    const w = buildTreeWrapper(person, 0);
    measureTreeWidth(w);
    assignTreeX(w, cursorX);
    cursorX += w._w + TREE_FAMILY_GAP;
    flattenTree(w, allNodes);
  });
  // Position verticale = promo effective (1A, 2A, 3A… 6A+), pas la profondeur dans
  // l'arbre de parrainage : deux personnes de la même promo s'alignent donc toujours
  // sur la même ligne, même si elles sont dans des branches de parrainage différentes.
  // Sens inversé : les plus anciens (promo la plus haute) en haut, les 1A en bas —
  // d'où les deux passes : il faut connaître maxPromo avant de placer qui que ce soit.
  let maxPromo = 1;
  allNodes.forEach(n => {
    n.promo = effectiveLevelInfo(n.person).promo || 1;
    if(n.promo > maxPromo) maxPromo = n.promo;
  });
  allNodes.forEach(n => {
    n.y = TREE_PAD_TOP + (maxPromo - n.promo) * TREE_LEVEL_H;
  });
  const totalWidth = Math.max(cursorX - TREE_FAMILY_GAP + TREE_PAD_X, 320);
  const totalHeight = TREE_PAD_TOP + maxPromo * TREE_LEVEL_H + 20;
  const extraLinks = buildExtraLinks(allNodes);
  return { allNodes, extraLinks, totalWidth, totalHeight, maxPromo };
}
// Pour chaque personne ayant plus d'un parrain, la position dans l'arbre est fixée
// par son parrain PRINCIPAL (voir primaryParrainId). Les parrains supplémentaires
// n'ont pas de case à eux : on relie simplement leur case existante à l'unique case
// de leur filleul, comme deux branches qui se rejoignent sur un même enfant.
function buildExtraLinks(allNodes){
  const byId = new Map(allNodes.map(n => [n.person.id, n]));
  const links = [];
  allNodes.forEach(n => {
    const primary = primaryParrainId(n.person);
    validParrainIds(n.person).forEach(pid => {
      if(pid === primary) return;
      const parentNode = byId.get(pid);
      if(!parentNode) return; // parrain hors-champ (branche repliée ailleurs) : rien à tracer
      links.push({ from: parentNode, to: n });
    });
  });
  return links;
}
function renderTreeCard(n, matchIds){
  const p = n.person;
  const isPh = p.status === "placeholder";
  const x = n.x - TREE_NODE_W/2, y = n.y;
  const info = effectiveLevelInfo(p);
  const multiParrain = validParrainIds(p).length > 1;
  let cls = "tree-card";
  if(isPh) cls += " tree-card-placeholder";
  if(matchIds){
    if(matchIds.has(p.id)) cls += " tree-card-match";
    else cls += " tree-card-dim";
  }
  const titleSuffix = multiParrain ? " — plusieurs parrains (voir les traits pointillés)" : "";
  return `<foreignObject x="${x}" y="${y}" width="${TREE_NODE_W}" height="${TREE_NODE_H}">
    <div xmlns="http://www.w3.org/1999/xhtml" class="${cls}">
      <div class="tree-card-main" data-open-profile="${p.id}" title="${esc(fullName(p))} — ${esc(info.label)}${titleSuffix}">
        <span class="badge ${info.badgeClass}">${esc(info.label)}</span>
        <span class="tree-card-name ${isPh?'placeholder-name':''}">${esc(fullName(p))}</span>
        ${multiParrain ? `<span title="Plusieurs parrains" style="font-size:11px;color:var(--amber-dark);flex-shrink:0;">⋔</span>` : ""}
      </div>
      ${n.hasRealChildren ? `<button type="button" class="tree-toggle" data-toggle-collapse="${p.id}">${n.collapsed?'▸ déplier':'▾'} ${n.realChildCount} filleul${n.realChildCount>1?'s':''}</button>` : ""}
    </div>
  </foreignObject>`;
}
function renderTreeLinks(n, matchIds){
  if(n.children.length === 0) return "";
  const px = n.x, py = n.y + TREE_NODE_H;
  const branchY = py + TREE_STEM;
  const xs = n.children.map(c=>c.x);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const dimAll = matchIds && !matchIds.has(n.person.id);
  const cls = dimAll ? "tree-link dim" : "tree-link";
  let out = `<path class="${cls}" d="M${px},${py} L${px},${branchY}" />`;
  if(n.children.length > 1){
    out += `<path class="${cls}" d="M${minX},${branchY} L${maxX},${branchY}" />`;
  }
  n.children.forEach(c=>{
    const cCls = (matchIds && !matchIds.has(c.person.id) && !matchIds.has(n.person.id)) ? "tree-link dim" : "tree-link";
    out += `<path class="${cCls}" d="M${c.x},${branchY} L${c.x},${c.y}" />`;
  });
  return out;
}
// Trait en courbe (pointillé, ambré) reliant un parrain supplémentaire directement
// à la case unique de son filleul — le "second parent" qui rejoint l'enfant, comme
// dans un arbre généalogique classique.
function renderExtraLink(link, matchIds){
  const x1 = link.from.x, y1 = link.from.y + TREE_NODE_H;
  const x2 = link.to.x, y2 = link.to.y;
  const midY = (y1 + y2) / 2;
  const dim = matchIds && !matchIds.has(link.from.person.id) && !matchIds.has(link.to.person.id);
  const cls = dim ? "tree-link-extra dim" : "tree-link-extra";
  return `<path class="${cls}" d="M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}" />`;
}

// Bande de repères à gauche + lignes pointillées horizontales : une ligne par promo
// (1A, 2A, 3A… 6A+), pour que l'alignement horizontal des cartes d'une même année
// saute aux yeux.
function renderPromoRows(maxPromo, totalWidth){
  let out = "";
  for(let i=1; i<=maxPromo; i++){
    const y = TREE_PAD_TOP + (maxPromo - i) * TREE_LEVEL_H;
    const cls = i <= 5 ? "b" + i + "A" : "bAlumni";
    const label = i + "A";
    out += `<line x1="0" y1="${y - 10}" x2="${totalWidth}" y2="${y - 10}" class="tree-row-divider" />`;
    out += `<foreignObject x="0" y="${y}" width="${TREE_ROW_GUTTER_W - 8}" height="${TREE_NODE_H}">
      <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;height:100%;">
        <span class="badge ${cls}" style="opacity:.85;">${esc(label)}</span>
      </div>
    </foreignObject>`;
  }
  return out;
}

// remonte tous les ancêtres d'une personne (par tous ses parrains) pour "ne pas casser" une recherche
function ancestorsOf(id, acc){
  acc = acc || new Set();
  const p = findPerson(id);
  if(!p) return acc;
  parrainIdsOf(p).forEach(pid=>{
    if(acc.has(pid)) return; // déjà vu, évite les boucles
    acc.add(pid);
    ancestorsOf(pid, acc);
  });
  return acc;
}

function renderArbre(){
  const legendLabels = ["1A","2A","3A","4A","5A","6A","7A","8A","9A","10A+"];
  const legend = `
    <div class="tree-legend">
      ${legendLabels.map(l=>{
        const cls = l==="6A" || l==="7A+" ? "bAlumni" : levelBadgeClass(l);
        return `<span><span class="badge ${cls}">${l}</span></span>`;
      }).join("")}
      <span>Contour pointillé = filleul non inscrit</span>
      <span><span style="display:inline-block;width:18px;height:0;border-top:2px dashed var(--amber);"></span> Second parrain (même personne)</span>
    </div>`;
  if(roots().length === 0){
    return `<div class="panel">
      <p class="intro">Chaque branche part d'un membre fondateur (sans parrain) en haut et descend vers ses filleuls, des plus anciens (en haut) aux 1A (en bas).</p>
      ${legend}
      <div class="empty">Aucune famille pour l'instant. Sois le premier à <a href="#" data-goto="rejoindre">rejoindre l'arbre</a>.</div>
    </div>`;
  }
  const { allNodes, extraLinks, totalWidth, totalHeight, maxPromo } = computeForestLayout();

  const q = treeSearch.trim().toLowerCase();
  let matchIds = null;
  let matchCount = 0;
  if(q){
    matchIds = new Set();
    allNodes.forEach(n => {
      const p = n.person;
      const info = effectiveLevelInfo(p);
      const hay = (fullName(p) + " " + info.label + " " + p.level).toLowerCase();
      if(hay.includes(q)){
        matchIds.add(p.id);
        matchCount++;
        // remonte aussi tous ses parrains pour garder le chemin visible
        ancestorsOf(p.id, matchIds);
      }
    });
  }

  const rowsHtml = renderPromoRows(maxPromo, totalWidth);
  const linksHtml = allNodes.filter(n => n.children.length>0).map(n => renderTreeLinks(n, matchIds)).join("");
  const extraLinksHtml = extraLinks.map(link => renderExtraLink(link, matchIds)).join("");
  const cardsHtml = allNodes.map(n => renderTreeCard(n, matchIds)).join("");

  const zw = Math.round(totalWidth * treeZoom);
  const zh = Math.round(totalHeight * treeZoom);

  const controls = `<div class="tree-controls">
    <input type="text" id="tree-search" placeholder="Rechercher un nom, une promo (ex : 7A)…" value="${esc(treeSearch)}">
    <button type="button" class="btn secondary small" id="tree-expand-all">Tout déplier</button>
    <button type="button" class="btn secondary small" id="tree-collapse-all">Tout replier</button>
    <div class="tree-zoom">
      <button type="button" class="btn secondary small" id="tree-zoom-out" title="Dézoomer">−</button>
      <span class="tree-zoom-value">${Math.round(treeZoom*100)}%</span>
      <button type="button" class="btn secondary small" id="tree-zoom-in" title="Zoomer">+</button>
      <button type="button" class="btn secondary small" id="tree-zoom-reset" title="Réinitialiser">Reset</button>
    </div>
    <span class="tree-info">${allNodes.length} membre${allNodes.length>1?'s':''}${q?` · ${matchCount} correspondance${matchCount>1?'s':''}`:''}</span>
  </div>`;

  return `<div class="panel">
    <p class="intro">Chaque branche part d'un membre fondateur (sans parrain) et descend vers ses filleuls. Les plus anciens sont en haut, les 1A tout en bas. Les lignes horizontales correspondent aux promos (1A, 2A, 3A…) : tout le monde de la même année est aligné sur la même ligne, quelle que soit sa branche de parrainage. Quand un Diplômé a des filleuls, sa promo « visible » monte à 6A, 7A, etc. — et remonte donc plus haut dans l'arbre. Une personne avec plusieurs parrains n'a qu'une seule case, reliée à chacun de ses parrains. Clique sur une carte pour voir le profil, sur ▾ pour replier une branche, ou utilise la recherche pour retrouver quelqu'un.</p>
    ${controls}
    ${legend}
    <div class="tree-svg-wrap" id="tree-svg-wrap">
      <svg width="${zw}" height="${zh}" viewBox="0 0 ${totalWidth} ${totalHeight}" preserveAspectRatio="xMinYMin meet">
        <g>${rowsHtml}</g>
        <g>${linksHtml}</g>
        <g>${extraLinksHtml}</g>
        <g>${cardsHtml}</g>
      </svg>
    </div>
  </div>`;
}


// sourceId = id de la fiche (en attente) qui motive la création de ce placeholder.
// Tant qu'un admin n'a pas validé au moins une des fiches sources, le placeholder
// reste en status "placeholder_pending" et n'apparaît donc pas dans l'arbre.
function findOrCreatePlaceholder(prenom, nom, level = "1A", sourceId = null){
  const p1 = prenom.trim().toLowerCase();
  const n1 = nom.trim().toLowerCase();

  // Si un placeholder (visible ou en attente) existe déjà, on le réutilise
  let existing = people.find(p =>
    (p.status === "placeholder" || p.status === "placeholder_pending") &&
    p.prenom.trim().toLowerCase() === p1 &&
    p.nom.trim().toLowerCase() === n1
  );

  if(existing){
    if(existing.status === "placeholder_pending" && sourceId){
      if(!Array.isArray(existing.pendingSourceIds)) existing.pendingSourceIds = [];
      if(!existing.pendingSourceIds.includes(sourceId)) existing.pendingSourceIds.push(sourceId);
    }
    return existing;
  }

  const placeholder = {
    id: uid(),
    prenom: prenom.trim(),
    nom: nom.trim(),
    level,
    anneeDiplome: "",
    parrainIds: [],
    bde: { membre:false, nom:"" },
    experiences: [],
    status: sourceId ? "placeholder_pending" : "placeholder",
    pendingSourceIds: sourceId ? [sourceId] : [],
    submittedAt: new Date().toISOString()
  };

  people.push(placeholder);
  return placeholder;
}

// Une fois qu'une fiche est validée par l'admin, les placeholders qu'elle avait fait
// naître (futur parrain, filleul non inscrit) deviennent visibles dans l'arbre.
function revealPlaceholdersFor(personId){
  people.forEach(p=>{
    if(p.status === "placeholder_pending" && Array.isArray(p.pendingSourceIds) && p.pendingSourceIds.includes(personId)){
      p.status = "placeholder";
    }
  });
}

// Si une fiche est rejetée, on retire sa trace des placeholders qu'elle avait fait
// naître, et on supprime ceux qui n'ont plus aucune raison d'exister (ni autre source
// en attente, ni lien de parrainage confirmé).
function cleanupPlaceholdersForRejected(rejectedId){
  people.forEach(p=>{
    if(p.status === "placeholder_pending" && Array.isArray(p.pendingSourceIds)){
      p.pendingSourceIds = p.pendingSourceIds.filter(sid => sid !== rejectedId);
    }
  });
  people = people.filter(p=>{
    if(p.status !== "placeholder_pending") return true;
    const noSources = !p.pendingSourceIds || p.pendingSourceIds.length === 0;
    const noLinks = validParrainIds(p).length === 0;
    return !(noSources && noLinks);
  });
}

// Quand quelqu'un déclare un filleul dans son formulaire : si une fiche (réelle ou
// déjà déclarée par quelqu'un d'autre) correspond à ce nom, on AJOUTE ce parrain
// à sa liste de parrains au lieu de créer une nouvelle fiche en double — la branche
// existante (ex: filleul-parrain1) n'est pas modifiée, un second lien de parrainage
// (filleul-parrain2) est simplement ajouté sur la même fiche.
function attachFilleul(prenom, nom, level, parrainId, sourceId){
  const p1 = prenom.trim().toLowerCase(), n1 = nom.trim().toLowerCase();
  if(!p1 || !n1 || !parrainId) return null;

  const existing = people.find(p => p.status !== "rejected" &&
    p.prenom.trim().toLowerCase() === p1 && p.nom.trim().toLowerCase() === n1);

  if(existing){
    addParrainId(existing, parrainId);
    return existing;
  }

  const placeholder = findOrCreatePlaceholder(prenom, nom, level, sourceId);
  addParrainId(placeholder, parrainId);
  return placeholder;
}

/* =========================================================================
   ANNUAIRE
   ========================================================================= */
function renderAnnuaire(){
  const list = approvedPeople()
    .filter(p => {
      if(!dirLevel) return true;
      const info = effectiveLevelInfo(p);
      return info.label === dirLevel || p.level === dirLevel;
    })
    .filter(p => !dirFiliere || p.filiere === dirFiliere)
    .filter(p => {
      if(!dirQuery) return true;
      const q = dirQuery.toLowerCase();
      const info = effectiveLevelInfo(p);
      const hay = [p.prenom, p.nom, info.label, p.filiere || "", p.bde?.nom || "", ...(p.experiences||[]).filter(e=>e.visible).map(e=>e.entreprise+" "+e.poste)].join(" ").toLowerCase();
      return hay.includes(q);
    })
    .sort((a,b)=> fullName(a).localeCompare(fullName(b)));

  return `<div class="panel">
    <p class="intro">Recherche un ancien par nom, promo, BDE ou entreprise (les infos pro affichées ici sont uniquement celles que la personne a choisi de rendre visibles).</p>
    <div class="dir-controls">
      <input type="text" id="dir-search" placeholder="Nom, entreprise, BDE, filière…" value="${esc(dirQuery)}">
      <select id="dir-level">
        <option value="">Toutes promos</option>
        ${LEVELS.map(l=>`<option value="${l}" ${dirLevel===l?'selected':''}>${l}</option>`).join("")}
      </select>
      <select id="dir-filiere">
        <option value="">Toutes filières</option>
        ${FILIERES.map(fi=>`<option value="${fi}" ${dirFiliere===fi?'selected':''}>${fi}</option>`).join("")}
      </select>
    </div>
    ${list.length===0 ? `<div class="empty">Aucun résultat.</div>` :
      list.map(p => {
        const info = effectiveLevelInfo(p);
        const visExp = (p.experiences||[]).filter(e=>e.visible);
        const subParts = [];
        if(p.filiere) subParts.push(esc(p.filiere));
        if(visExp.length) subParts.push(esc(visExp[0].poste + " · " + visExp[0].entreprise));
        else if(p.bde?.membre) subParts.push("BDE " + esc(p.bde.nom));
        const sub = subParts.join(" · ");
        return `<div class="dir-row" data-open-profile="${p.id}">
          <div class="dir-left">
            <span class="badge ${info.badgeClass}">${esc(info.label)}</span>
            <div>
              <div class="dir-name">${esc(fullName(p))}</div>
              ${sub ? `<div class="dir-sub">${sub}</div>` : ""}
            </div>
          </div>
        </div>`;
      }).join("")
    }
  </div>`;
}

/* =========================================================================
   REJOINDRE (formulaire d'inscription)
   ========================================================================= */
function blankJoinForm(){
  return {
    prenom:"", nom:"", level:"1A", anneeDiplome:"", filiere:"",
    parrainMode: "choisi", // 'choisi' | 'futur' | 'aucun'
    parrainId: "",
    parrainSearch: "",
    parrainNonInscrit: {
      prenom: "",
      nom: "",
      level: "1A"
    },
    bdeMembre:false, bdeNom:"",
    experiences: [],
    filleulsConnus: [], // [{prenom,nom,level}]
    claimId: null,        // id d'un filleul déjà déclaré que cette personne réclame comme étant elle
    claimDismissed: false, // l'utilisateur a dit "ce n'est pas moi" pour les suggestions actuelles
    errors: {},
  };
}
function renderRejoindre(){
  if(!joinForm) joinForm = blankJoinForm();
  const f = joinForm;
  const approved = approvedPeople();
  const matches = f.parrainSearch.trim().length>0
    ? approved.filter(p => fullName(p).toLowerCase().includes(f.parrainSearch.trim().toLowerCase())).slice(0,8)
    : [];
  const chosen = f.parrainId ? findPerson(f.parrainId) : null;
  const claimed = f.claimId ? findPerson(f.claimId) : null;
  const phMatches = (!f.claimId && !f.claimDismissed) ? placeholderMatches(f.prenom, f.nom) : [];
  const realMatches = !claimed ? existingRealMatches(f.prenom, f.nom, null) : [];

  const errorCount = Object.keys(f.errors||{}).length;
  return `<div class="panel">
    <p class="intro">Renseigne tes infos pour te placer dans l'arbre. Ta fiche sera <strong>vérifiée par l'admin de l'école</strong> avant d'apparaître, pour garder l'arbre fiable.</p>
    ${errorCount ? `<div class="warning-box" id="form-error-banner">⚠ ${errorCount === 1 ? "Un champ" : "Certains champs"} doit être corrigé avant l'envoi — regarde les messages en rouge ci-dessous.</div>` : ""}

    <form id="join-form" novalidate>
      <div class="form-section">
        <h3>Identité</h3>
        <div class="row2">
          <div class="field">
            <label>Prénom *</label>
            <input type="text" name="prenom" value="${esc(f.prenom)}">
            ${f.errors.prenom?`<div class="error-text">${f.errors.prenom}</div>`:""}
          </div>
          <div class="field">
            <label>Nom *</label>
            <input type="text" name="nom" value="${esc(f.nom)}">
            ${f.errors.nom?`<div class="error-text">${f.errors.nom}</div>`:""}
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>Promo actuelle *</label>
            <select name="level">${LEVELS.map(l=>`<option value="${l}" ${f.level===l?'selected':''}>${l}</option>`).join("")}</select>
          </div>
          <div class="field">
            <label>Année de diplôme (obtenue ou prévue) *</label>
            <input type="number" name="anneeDiplome" min="1980" max="2035" value="${esc(f.anneeDiplome)}" placeholder="ex : 2027">
            ${f.errors.anneeDiplome?`<div class="error-text">${f.errors.anneeDiplome}</div>`:""}
          </div>
        </div>
        <div class="field">
          <label>Filière</label>
          <select name="filiere">
            <option value="" ${!f.filiere?'selected':''}>— Pas encore choisie —</option>
            ${FILIERES.map(fi=>`<option value="${fi}" ${f.filiere===fi?'selected':''}>${fi}</option>`).join("")}
          </select>
          <div class="hint" style="margin-top:5px;">La filière se choisit généralement en 3A. Tu pourras la mettre à jour plus tard.</div>
        </div>
      </div>

      ${claimed ? `
        <div class="success-box">
          Tu réclames la fiche déclarée par <strong>${parrainsOf(claimed).length ? parrainsOf(claimed).map(fullName).map(esc).join(", ") : "?"}</strong> (${esc(claimed.level)} déclaré). ${parrainsOf(claimed).length>1 ? "Ces liens parrain → filleul sont" : "Ce lien parrain → filleul est"} conservé${parrainsOf(claimed).length>1?'s':''} automatiquement.
          <div style="margin-top:8px;"><button type="button" class="btn secondary small" id="unclaim">Ce n'est pas moi / annuler</button></div>
        </div>
      ` : phMatches.length>0 ? `
        <div class="warning-box">
          <div style="margin-bottom:8px;">On dirait que quelqu'un t'a déjà déclaré comme filleul. Est-ce toi ?</div>
          ${phMatches.map(m => {
            const pars = parrainsOf(m);
            return `<div class="search-picker-item" style="background:var(--white);border:1px solid var(--line);border-radius:3px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;" data-claim-placeholder="${m.id}">
              <span>${esc(fullName(m))} — ${esc(m.level)} ${pars.length? '· déclaré par '+pars.map(fullName).map(esc).join(", ") : ''}</span>
              <span class="btn small" style="pointer-events:none;">C'est moi</span>
            </div>`;
          }).join("")}
          <button type="button" class="btn secondary small" id="dismiss-claim">Aucun de ceux-là, c'est moi qui crée ma fiche</button>
        </div>
      ` : realMatches.length>0 ? `
        <div class="warning-box">
          Une fiche à ce nom existe déjà (${realMatches[0].status === 'approved' ? 'validée' : 'en attente de validation'}). Si c'est toi, inutile d'en recréer une — préviens l'admin pour éviter un doublon.
        </div>
      ` : ""}

      <div class="form-section">
        <h3>Parrainage</h3>

        ${claimed ? `<p class="hint">
          Le parrain est déjà connu grâce à la fiche que tu réclames ci-dessus.
        </p>` : `

          <p class="hint">
            Qui t'a parrainé à l'ISFA ? Ça permet de te placer au bon endroit dans l'arbre.
          </p>

          <label class="checkline" style="margin-bottom:10px;">
            <input type="checkbox" id="no-parrain" ${f.parrainMode==='aucun'?'checked':''}>
            Je n'ai pas de parrain (membre fondateur / arrivé autrement)
          </label>

          ${f.parrainMode==='aucun' ? "" : `

            ${chosen ? `
              <div class="parrain-chosen">
                <span>${esc(fullName(chosen))} — ${esc(chosen.level)}</span>
                <button type="button" class="btn secondary small" id="clear-parrain">
                  Changer
                </button>
              </div>

            ` : f.parrainMode==='futur' ? `

              <div class="row2">
                <div class="field">
                  <label>Prénom du futur parrain</label>
                  <input
                    type="text"
                    id="futur-parrain-prenom"
                    value="${esc(f.parrainNonInscrit.prenom)}"
                    placeholder="Prénom">
                </div>

                <div class="field">
                  <label>Nom du futur parrain</label>
                  <input
                    type="text"
                    id="futur-parrain-nom"
                    value="${esc(f.parrainNonInscrit.nom)}"
                    placeholder="Nom">
                </div>
              </div>

              <div class="field">
                <label>Niveau du futur parrain</label>
                <select id="futur-parrain-level">
                  ${LEVELS.map(l =>
                    `<option value="${l}" ${f.parrainNonInscrit.level===l?'selected':''}>${l}</option>`
                  ).join("")}
                </select>
              </div>

              <p class="hint">
                Cette personne n'est pas encore inscrite. Une place lui sera réservée.
                Lorsqu'elle s'inscrira, elle pourra récupérer automatiquement cette place.
              </p>

              <button
                type="button"
                class="btn secondary small"
                id="cancel-futur-parrain">
                Finalement, mon parrain est inscrit
              </button>

            ` : `

              <input
                type="text"
                id="parrain-search"
                placeholder="Rechercher ton parrain par nom…"
                value="${esc(f.parrainSearch)}">

              ${matches.length>0 ? `<div class="search-picker">
                ${matches.map(m =>
                  `<div class="search-picker-item" data-pick-parrain="${m.id}">
                    ${esc(fullName(m))} — ${esc(m.level)}
                  </div>`
                ).join("")}
              </div>` :
              (f.parrainSearch.trim() ?
                `<div class="hint">Aucun résultat.</div>` : "")}

              <button
                type="button"
                class="btn secondary small"
                id="future-parrain">
                Mon parrain n'est pas encore inscrit
              </button>

              ${f.errors.parrainId ?
                `<div class="error-text">${f.errors.parrainId}</div>` : ""}
            `}
          `}
        `}
      </div>

      <div class="form-section">
        <h3>BDE</h3>
        <label class="checkline" style="margin-bottom:10px;">
          <input type="checkbox" id="bde-membre" ${f.bdeMembre?'checked':''}>
          J'ai fait partie d'un BDE
        </label>
        ${f.bdeMembre ? `<div class="field"><label>Nom du BDE</label><input type="text" id="bde-nom" value="${esc(f.bdeNom)}" placeholder="ex : BDE ISFA 2024"></div>` : ""}
      </div>

      <div class="form-section">
        <h3>Expériences professionnelles</h3>
        <p class="hint">Stages, alternances, poste actuel… Coche « visible » uniquement pour ce que tu veux montrer dans l'annuaire — sinon, ça reste privé (non affiché à qui que ce soit hors admin).</p>
        <div id="exp-list">
          ${f.experiences.map((e,i)=>renderExpEditRow(e,i)).join("")}
        </div>
        <button type="button" class="btn secondary small" id="add-exp">+ Ajouter une expérience</button>
      </div>

      <div class="form-section">
        <h3>Filleuls que tu as parrainés (optionnel)</h3>
        <p class="hint">S'ils n'ont pas encore rejoint l'arbre, ajoute-les ici : ils apparaîtront en pointillé, en attente qu'ils créent eux-mêmes leur fiche.</p>
        <div id="filleul-list">
          ${f.filleulsConnus.map((x,i)=>`
            <div class="filleul-row">
              <input type="text" placeholder="Prénom" data-fl="prenom" data-i="${i}" value="${esc(x.prenom)}">
              <input type="text" placeholder="Nom" data-fl="nom" data-i="${i}" value="${esc(x.nom)}">
              <select data-fl="level" data-i="${i}">${LEVELS.map(l=>`<option value="${l}" ${x.level===l?'selected':''}>${l}</option>`).join("")}</select>
              <button type="button" class="btn secondary small" data-remove-fl="${i}">✕</button>
            </div>
          `).join("")}
        </div>
        <button type="button" class="btn secondary small" id="add-fl">+ Ajouter un filleul</button>
      </div>

      <button type="submit" class="btn">Envoyer ma fiche</button>
    </form>
  </div>`;
}
function renderExpEditRow(e,i){
  return `<div class="exp-card" data-exp-idx="${i}">
    <div class="exp-card-top">
      <div class="row2" style="flex:1;">
        <div class="field" style="margin-bottom:8px;">
          <label>Poste</label>
          <input type="text" data-exp="poste" data-i="${i}" value="${esc(e.poste)}" placeholder="ex : Data Analyst">
        </div>
        <div class="field" style="margin-bottom:8px;">
          <label>Entreprise</label>
          <input type="text" data-exp="entreprise" data-i="${i}" value="${esc(e.entreprise)}">
        </div>
      </div>
      <button type="button" class="btn secondary small" data-remove-exp="${i}">✕</button>
    </div>
    <div class="row2">
      <div class="field" style="margin-bottom:0;">
        <label>Type</label>
        <select data-exp="type" data-i="${i}">${EXP_TYPES.map(t=>`<option ${e.type===t?'selected':''}>${t}</option>`).join("")}</select>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Période</label>
        <input type="text" data-exp="periode" data-i="${i}" value="${esc(e.periode)}" placeholder="ex : 2023 – 2024">
      </div>
    </div>
    <label class="checkline" style="margin-top:10px;">
      <input type="checkbox" data-exp="visible" data-i="${i}" ${e.visible?'checked':''}>
      Visible dans l'annuaire
    </label>
  </div>`;
}

/* =========================================================================
   ADMIN
   ========================================================================= */
function renderAdmin(){
  if(!isAdmin){
    return `<div class="panel admin-gate">
      <h3 style="margin-bottom:10px;">Accès admin</h3>
      <p class="hint" style="margin-bottom:14px;">Réservé à la personne qui gère l'arbre.</p>
      <input type="password" id="admin-pass" placeholder="Mot de passe" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;margin-bottom:10px;">
      <button class="btn" id="admin-login" style="width:100%;justify-content:center;">Se connecter</button>
      <div id="admin-error" class="error-text" style="text-align:center;margin-top:8px;"></div>
    </div>`;
  }
  const pend = pendingPeople();
  const ph = placeholderPeople();
  const app = approvedPeople();
  const stats = LEVELS.map(l => ({l, n: app.filter(p=>p.level===l).length}));

  return `<div class="panel">
    <div class="warning-box" style="margin-bottom:14px;">
      ⓘ L'authentification est <strong>locale au navigateur</strong> : n'importe qui avec un accès aux outils développeur peut potentiellement contourner cette page. Ne laisse pas la session ouverte sur un poste public et change régulièrement le mot de passe.
    </div>
    <div class="section-title">
      <h3>Vue d'ensemble</h3>
      <button class="btn secondary small" id="admin-logout">Se déconnecter</button>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${app.length}</div><div class="lbl">Membres validés</div></div>
      <div class="stat-card"><div class="num">${pend.length}</div><div class="lbl">En attente</div></div>
      <div class="stat-card"><div class="num">${ph.length}</div><div class="lbl">Filleuls non réclamés</div></div>
      ${stats.map(s=>`<div class="stat-card"><div class="num">${s.n}</div><div class="lbl">${s.l}</div></div>`).join("")}
    </div>
  </div>

  <div class="panel">
    <h3 style="margin-bottom:14px;">Demandes en attente (${pend.length})</h3>
    ${pend.length===0 ? `<div class="empty">Aucune demande en attente.</div>` : pend.map(p=>renderAdminPendingItem(p)).join("")}
  </div>

  <div class="panel">
    <h3 style="margin-bottom:14px;">Filleuls non réclamés (${ph.length})</h3>
    ${ph.length===0 ? `<div class="empty">Aucun.</div>` : ph.map(p=>`
      <div class="admin-item">
        <div class="admin-item-top">
          <div><strong>${esc(fullName(p))}</strong> — ${esc(p.level)} ${p.status==="placeholder_pending" ? `<span class="pill pending">en attente de validation</span>` : `<span class="pill approved">visible dans l'arbre</span>`} <span class="node-meta">déclaré par ${parrainsOf(p).length ? parrainsOf(p).map(fullName).map(esc).join(", ") : "?"}</span></div>
          <div class="admin-actions">
            <button class="btn danger small" data-delete-person="${p.id}">Supprimer</button>
          </div>
        </div>
      </div>
    `).join("")}
  </div>

  <div class="panel">
    <h3 style="margin-bottom:14px;">Membres validés (${app.length})</h3>
    ${app.length===0 ? `<div class="empty">Aucun.</div>` : app.sort((a,b)=>fullName(a).localeCompare(fullName(b))).map(p=>{
      const info = effectiveLevelInfo(p);
      return `
      <div class="admin-item">
        <div class="admin-item-top">
          <div><span class="badge ${info.badgeClass}">${esc(info.label)}</span> <strong>${esc(fullName(p))}</strong> <span class="node-meta">(stocké : ${esc(p.level)}${p.filiere?` · ${esc(p.filiere)}`:""})</span></div>
          <div class="admin-actions">
            <button class="btn secondary small" data-edit-person="${p.id}">Modifier</button>
            <button class="btn danger small" data-delete-person="${p.id}">Supprimer</button>
          </div>
        </div>
      </div>
    `;}).join("")}
  </div>

  ${editingId ? renderAdminEditModal() : ""}
  `;
}
function renderAdminPendingItem(p){
  const parrains = parrainsOf(p);
  const dup = nameTaken(p.prenom, p.nom, p.id);
  return `<div class="admin-item">
    <div class="admin-item-top">
      <div>
        <strong>${esc(fullName(p))}</strong> — ${esc(p.level)} · diplôme ${esc(p.anneeDiplome)}
        ${dup ? `<span class="pill pending" style="margin-left:6px;">⚠ nom similaire déjà présent</span>` : ""}
      </div>
    </div>
    <div class="node-meta" style="margin-top:6px;">
      Parrain${parrains.length>1?'s déclarés':' déclaré'} : ${parrains.length ? parrains.map(pr=>esc(fullName(pr))+" ("+esc(pr.level)+")").join(", ") : "aucun (fondateur déclaré)"}
      ${p.filiere ? " · filière " + esc(p.filiere) : " · filière non renseignée"}
      ${p.bde?.membre ? " · BDE " + esc(p.bde.nom) : ""}
    </div>
    ${(p.experiences||[]).length ? `<div class="node-meta" style="margin-top:4px;">Expériences : ${p.experiences.map(e=>esc(e.poste+' @ '+e.entreprise)+(e.visible?'':' (privé)')).join(' · ')}</div>` : ""}
    ${(p.filleulsConnus||[]).length ? `<div class="node-meta" style="margin-top:4px;">Filleuls déclarés : ${p.filleulsConnus.map(f=>esc(f.prenom+' '+f.nom+' ('+f.level+')')).join(', ')}</div>` : ""}
    <div class="admin-actions">
      <button class="btn small" data-approve="${p.id}">Valider</button>
      <button class="btn danger small" data-reject="${p.id}">Rejeter</button>
    </div>
  </div>`;
}

function renderAdminEditModal(){
  const p = findPerson(editingId);
  if(!p) return "";
  return `<div id="edit-modal-backdrop" style="position:fixed;inset:0;background:rgba(28,43,57,.55);z-index:60;">
    <div class="modal-box" style="margin:40px auto;">
      <button class="modal-close" id="close-edit">×</button>
      <h3 style="margin-bottom:16px;">Modifier — ${esc(fullName(p))}</h3>
      <div class="row2">
        <div class="field"><label>Prénom</label><input type="text" id="edit-prenom" value="${esc(p.prenom)}"></div>
        <div class="field"><label>Nom</label><input type="text" id="edit-nom" value="${esc(p.nom)}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Promo</label><select id="edit-level">${LEVELS.map(l=>`<option ${p.level===l?'selected':''}>${l}</option>`).join("")}</select></div>
        <div class="field"><label>Année diplôme</label><input type="number" id="edit-annee" value="${esc(p.anneeDiplome)}"></div>
      </div>
      <div class="field">
        <label>Filière</label>
        <select id="edit-filiere">
          <option value="" ${!p.filiere?'selected':''}>— Aucune —</option>
          ${FILIERES.map(fi=>`<option value="${fi}" ${p.filiere===fi?'selected':''}>${fi}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>Parrain(s)</label>
        <select id="edit-parrain" multiple size="6">
          ${approvedPeople().filter(x=>x.id!==p.id).map(x=>`<option value="${x.id}" ${parrainIdsOf(p).includes(x.id)?'selected':''}>${esc(fullName(x))} (${x.level})</option>`).join("")}
        </select>
        <div class="hint" style="margin-top:5px;">Ctrl/Cmd-clic (ou Cmd sur Mac) pour sélectionner plusieurs parrains, ou n'en sélectionner aucun.</div>
      </div>
      <button class="btn" id="save-edit">Enregistrer</button>
    </div>
  </div>`;
}

/* =========================================================================
   MODAL — profil
   ========================================================================= */
function openProfileModal(id){
  const p = findPerson(id);
  if(!p) return;
  const root = $("#modal-root");
  const parrains = parrainsOf(p);
  const kids = childrenOf(p.id);
  const isPh = p.status === "placeholder" || p.status === "placeholder_pending";
  const exps = (p.experiences||[]).filter(e => isAdmin || e.visible);
  const info = effectiveLevelInfo(p);
  root.innerHTML = `
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-box">
      <button class="modal-close" data-close-modal>×</button>
      <div class="modal-title">
        <h3>${esc(fullName(p))}</h3>
        <span class="badge ${info.badgeClass}">${esc(info.label)}</span>
      </div>
      <div class="modal-sub">${isPh ? "Filleul déclaré — n'a pas encore créé sa fiche" : "Diplôme " + esc(p.anneeDiplome)}${p.filiere ? ` · ${esc(p.filiere)}` : ""}${info.label !== p.level ? ` · promo stockée : ${esc(p.level)}` : ""}</div>

      <div class="modal-block">
        <h4>Famille</h4>
        <div class="node-meta">Parrain${parrains.length>1?'s':''} : ${parrains.length ? parrains.map(pr=>{
          const pri = effectiveLevelInfo(pr);
          return esc(fullName(pr))+" ("+esc(pri.label)+")";
        }).join(", ") : "— (fondateur)"}</div>
        <div class="node-meta">Filleuls : ${kids.length ? kids.map(k=>{
          const ki = effectiveLevelInfo(k);
          return esc(fullName(k))+" ("+esc(ki.label)+")";
        }).join(", ") : "aucun pour le moment"}</div>
        ${parrains.length>1 ? `<div class="node-meta" style="margin-top:6px;font-style:italic;">Plusieurs parrains : cette fiche apparaît donc dans plusieurs branches de l'arbre.</div>` : ""}
      </div>

      ${p.bde?.membre ? `<div class="modal-block"><h4>BDE</h4><div class="node-meta">${esc(p.bde.nom)}</div></div>` : ""}

      <div class="modal-block">
        <h4>Parcours professionnel</h4>
        ${exps.length ? exps.map(e=>`
          <div class="exp-view">
            <div class="role">${esc(e.poste)} — ${esc(e.entreprise)}</div>
            <div class="meta">${esc(e.type)} · ${esc(e.periode)} ${(!e.visible && isAdmin) ? "· 🔒 privé (visible admin seulement)" : ""}</div>
          </div>
        `).join("") : `<div class="locked-note">Rien de partagé publiquement.</div>`}
      </div>
    </div>
  `;
  root.classList.add("open");
}
function closeModal(){
  $("#modal-root").classList.remove("open");
  $("#modal-root").innerHTML = "";
}

/* =========================================================================
   VALIDATION
   ========================================================================= */
function validateJoinForm(f){
  const errors = {};

  if(!NAME_RE.test(f.prenom.trim()))
    errors.prenom = "Prénom invalide (2-40 lettres).";

  if(!NAME_RE.test(f.nom.trim()))
    errors.nom = "Nom invalide (2-40 lettres).";

  const yr = parseInt(f.anneeDiplome,10);

  if(!yr || yr < 1980 || yr > 2035)
    errors.anneeDiplome = "Année invalide.";

  if(!f.claimId && f.parrainMode === "choisi" && !f.parrainId){
    errors.parrainId =
      "Choisis ton parrain dans la liste, indique un futur parrain, ou coche « je n'ai pas de parrain ».";
  }

  if(!f.claimId && f.parrainMode === "futur"){
    if(!f.parrainNonInscrit.prenom.trim())
      errors.parrainId = "Indique le prénom de ton futur parrain.";

    if(!f.parrainNonInscrit.nom.trim())
      errors.parrainId = "Indique le nom de ton futur parrain.";
  }

  return errors;
}

/* =========================================================================
   EVENTS
   ========================================================================= */
function attachViewListeners(){
  // profile open
  $$("[data-open-profile]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.preventDefault();
      openProfileModal(el.dataset.openProfile);
    });
  });
  $$("[data-goto]").forEach(el=>{
    el.addEventListener("click", (e)=>{ e.preventDefault(); currentTab = el.dataset.goto; render(); });
  });

  if(currentTab === "arbre"){
    $$("[data-toggle-collapse]").forEach(el=>{
      el.addEventListener("click", (e)=>{
        e.stopPropagation();
        const id = el.dataset.toggleCollapse;
        if(collapsedIds.has(id)) collapsedIds.delete(id); else collapsedIds.add(id);
        render();
      });
    });
    $("#tree-search")?.addEventListener("input", e=>{
      treeSearch = e.target.value; render();
      const el = $("#tree-search");
      if(el){ el.focus(); el.selectionStart = el.value.length; }
    });
    $("#tree-expand-all")?.addEventListener("click", ()=>{ collapsedIds.clear(); render(); });
    $("#tree-collapse-all")?.addEventListener("click", ()=>{
      collapsedIds = new Set(visiblePeople().filter(p=>primaryChildrenOf(p.id).length>0).map(p=>p.id));
      render();
    });
    $("#tree-zoom-in")?.addEventListener("click", ()=>{ treeZoom = Math.min(2.5, Math.round((treeZoom+0.1)*10)/10); render(); });
    $("#tree-zoom-out")?.addEventListener("click", ()=>{ treeZoom = Math.max(0.4, Math.round((treeZoom-0.1)*10)/10); render(); });
    $("#tree-zoom-reset")?.addEventListener("click", ()=>{ treeZoom = 1; render(); });
  }

  if(currentTab === "annuaire"){
    $("#dir-search")?.addEventListener("input", e=>{ dirQuery = e.target.value; render(); $("#dir-search").focus(); $("#dir-search").selectionStart = $("#dir-search").value.length; });
    $("#dir-level")?.addEventListener("change", e=>{ dirLevel = e.target.value; render(); });
    $("#dir-filiere")?.addEventListener("change", e=>{ dirFiliere = e.target.value; render(); });
  }

  if(currentTab === "rejoindre") attachJoinListeners();
  if(currentTab === "admin") attachAdminListeners();
}

function attachJoinListeners(){
  const f = joinForm;
  const form = $("#join-form");
  if(!form) return;

  // détecte les correspondances (filleul déjà déclaré / doublon) quand on quitte prénom ou nom
  const recheckNames = ()=>{ syncFormFields(); render(); };
  $("[name=prenom]")?.addEventListener("blur", recheckNames);
  $("[name=nom]")?.addEventListener("blur", recheckNames);
  // si la personne retouche son nom après avoir refusé une suggestion, on relance la détection
  $("[name=prenom]")?.addEventListener("input", ()=>{ f.claimDismissed = false; });
  $("[name=nom]")?.addEventListener("input", ()=>{ f.claimDismissed = false; });

  $$("[data-claim-placeholder]").forEach(el=>{
    el.addEventListener("click", ()=>{
      syncFormFields();
      f.claimId = el.dataset.claimPlaceholder;
      f.claimDismissed = false;
      render();
    });
  });
  $("#dismiss-claim")?.addEventListener("click", ()=>{
    syncFormFields();
    f.claimDismissed = true;
    render();
  });
  $("#unclaim")?.addEventListener("click", ()=>{
    syncFormFields();
    f.claimId = null;
    f.claimDismissed = true;
    render();
  });

  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const now = Date.now();
    if(now - lastSubmitAt < SUBMIT_MIN_INTERVAL_MS){
      const wait = Math.ceil((SUBMIT_MIN_INTERVAL_MS - (now - lastSubmitAt))/1000);
      $("#view").insertAdjacentHTML("afterbegin", `<div class="panel"><div class="warning-box">Merci de patienter ${wait}s avant d'envoyer une nouvelle fiche.</div></div>`);
      return;
    }
    try{
      syncFormFields();
      const errors = validateJoinForm(f);
      f.errors = errors;
      if(Object.keys(errors).length){
        render();
        $("#form-error-banner")?.scrollIntoView({behavior:"smooth", block:"start"});
        return;
      }
      lastSubmitAt = Date.now();
      await submitJoinForm(f);
    }catch(err){
      console.error("Erreur à l'envoi du formulaire :", err);
      $("#view").insertAdjacentHTML("afterbegin", `<div class="panel"><div class="warning-box">Une erreur inattendue a bloqué l'envoi (${esc(err.message || err)}). Réessaie, ou préviens l'admin si ça persiste.</div></div>`);
    }
  });

  async function submitJoinForm(f){
    let person;
    const claimTarget = f.claimId ? findPerson(f.claimId) : null;

    if(claimTarget && (claimTarget.status === "placeholder" || claimTarget.status === "placeholder_pending")){
      // Réclamer la fiche déclarée : on la transforme au lieu de créer un doublon,
      // pour préserver son id et les liens vers ses éventuels propres filleuls.
      // Elle redevient une fiche "pending" classique, soumise à validation admin
      // comme n'importe quelle autre inscription.
      claimTarget.prenom = f.prenom.trim();
      claimTarget.nom = f.nom.trim();
      claimTarget.level = f.level;
      claimTarget.anneeDiplome = parseInt(f.anneeDiplome,10);
      claimTarget.filiere = FILIERES.includes(f.filiere) ? f.filiere : "";
      claimTarget.bde = { membre: f.bdeMembre, nom: f.bdeMembre ? f.bdeNom.trim() : "" };
      claimTarget.experiences = f.experiences.map(x=>({...x}));
      claimTarget.status = "pending";
      claimTarget.pendingSourceIds = [];
      claimTarget.submittedAt = new Date().toISOString();
      person = claimTarget;
    } else {

      // On fixe l'id dès maintenant : les placeholders créés ci-dessous (futur parrain,
      // filleuls non inscrits) s'en servent comme "source" — tant que CETTE fiche n'est
      // pas validée par l'admin, ils restent invisibles dans l'arbre.
      const newId = uid();
      let parrainId = null;

      if(f.parrainMode === "choisi"){
        parrainId = f.parrainId || null;
      }

      if(f.parrainMode === "futur"){
        const futurParrain = findOrCreatePlaceholder(
          f.parrainNonInscrit.prenom,
          f.parrainNonInscrit.nom,
          f.parrainNonInscrit.level,
          newId
        );

        parrainId = futurParrain.id;
      }

      if(f.parrainMode === "aucun"){
        parrainId = null;
      }

      person = {
        id: newId,
        prenom: f.prenom.trim(),
        nom: f.nom.trim(),
        level: f.level,
        anneeDiplome: parseInt(f.anneeDiplome,10),
        filiere: FILIERES.includes(f.filiere) ? f.filiere : "",
        parrainIds: parrainId ? [parrainId] : [],
        bde: {
          membre: f.bdeMembre,
          nom: f.bdeMembre ? f.bdeNom.trim() : ""
        },
        experiences: f.experiences.map(x=>({...x})),
        status: "pending",
        submittedAt: new Date().toISOString(),
      };

      people.push(person);
    }

    // filleuls connus -> on relie ce parrain à la fiche existante si elle existe déjà
    // (réelle ou placeholder), sans jamais créer de doublon de personne. S'il faut créer
    // un nouveau placeholder, il reste invisible tant que CETTE fiche n'est pas validée.
    (f.filleulsConnus || []).forEach(fl => {
      if(!fl.prenom.trim() || !fl.nom.trim()) return;
      attachFilleul(fl.prenom, fl.nom, fl.level, person.id, person.id);
    });

    await savePeople();
    joinForm = null;
    currentTab = "rejoindre";
    render();
    $("#view").insertAdjacentHTML("afterbegin", `<div class="panel"><div class="success-box">Ta fiche a bien été envoyée. Elle apparaîtra dans l'arbre dès validation par l'admin.</div></div>`);
  }

  $("#no-parrain")?.addEventListener("change", e=>{
    f.parrainMode = e.target.checked ? "aucun" : "choisi";
    f.parrainId=""; f.parrainSearch="";
    syncFormFields(); render();
  });
  $("#future-parrain")?.addEventListener("click", ()=>{
    syncFormFields();
    f.parrainMode = "futur";
    f.parrainId = "";
    f.parrainSearch = "";
    render();
  });
  $("#cancel-futur-parrain")?.addEventListener("click", ()=>{
    syncFormFields();
    f.parrainMode = "choisi";
    f.parrainNonInscrit = { prenom:"", nom:"", level:"1A" };
    render();
  });
  $("#parrain-search")?.addEventListener("input", e=>{
    f.parrainSearch = e.target.value; syncFormFields(); render();
    setTimeout(()=>{ const el=$("#parrain-search"); if(el){ el.focus(); el.selectionStart = el.value.length; } },0);
  });
  $$("[data-pick-parrain]").forEach(el=>{
    el.addEventListener("click", ()=>{
      f.parrainId = el.dataset.pickParrain; f.parrainSearch=""; syncFormFields(); render();
    });
  });
  $("#clear-parrain")?.addEventListener("click", ()=>{ f.parrainId=""; syncFormFields(); render(); });

  $("#bde-membre")?.addEventListener("change", e=>{ f.bdeMembre = e.target.checked; syncFormFields(); render(); });

  $("#add-exp")?.addEventListener("click", ()=>{
    syncFormFields();
    if(f.experiences.length >= MAX_EXPERIENCES){
      alert("Maximum " + MAX_EXPERIENCES + " expériences par fiche.");
      return;
    }
    f.experiences.push({poste:"",entreprise:"",type:"Stage",periode:"",visible:false});
    render();
  });
  $$("[data-remove-exp]").forEach(el=>{
    el.addEventListener("click", ()=>{ syncFormFields(); f.experiences.splice(parseInt(el.dataset.removeExp,10),1); render(); });
  });

  $("#add-fl")?.addEventListener("click", ()=>{
    syncFormFields();
    if(f.filleulsConnus.length >= MAX_FILLEULS_DECLARES){
      alert("Maximum " + MAX_FILLEULS_DECLARES + " filleuls déclarés par fiche.");
      return;
    }
    f.filleulsConnus.push({prenom:"",nom:"",level:"1A"});
    render();
  });
  $$("[data-remove-fl]").forEach(el=>{
    el.addEventListener("click", ()=>{ syncFormFields(); f.filleulsConnus.splice(parseInt(el.dataset.removeFl,10),1); render(); });
  });
}
// pull live input values into joinForm before any re-render triggered by a non-input control
function syncFormFields(){
  const f = joinForm;
  const g = sel => $(sel)?.value;
  if($("[name=prenom]")) f.prenom = g("[name=prenom]");
  if($("[name=nom]")) f.nom = g("[name=nom]");
  if($("[name=level]")) f.level = g("[name=level]");
  if($("[name=anneeDiplome]")) f.anneeDiplome = g("[name=anneeDiplome]");
  if($("[name=filiere]")) f.filiere = g("[name=filiere]");
  if($("#bde-nom")) f.bdeNom = g("#bde-nom");
  if($("#futur-parrain-prenom"))
    f.parrainNonInscrit.prenom = g("#futur-parrain-prenom");
  if($("#futur-parrain-nom"))
    f.parrainNonInscrit.nom = g("#futur-parrain-nom");
  if($("#futur-parrain-level"))
    f.parrainNonInscrit.level = g("#futur-parrain-level");
  $$("[data-exp]").forEach(el=>{
    const i = parseInt(el.dataset.i,10);
    const field = el.dataset.exp;
    if(!f.experiences[i]) return;
    f.experiences[i][field] = field==="visible" ? el.checked : el.value;
  });
  $$("[data-fl]").forEach(el=>{
    const i = parseInt(el.dataset.i,10);
    const field = el.dataset.fl;
    if(!f.filleulsConnus[i]) return;
    f.filleulsConnus[i][field] = el.value;
  });
}

function attachAdminListeners(){
  $("#admin-login")?.addEventListener("click", async ()=>{
    const errEl = $("#admin-error");
    const now = Date.now();
    if(loginLockedUntil > now){
      const remain = Math.ceil((loginLockedUntil - now)/1000);
      if(errEl) errEl.textContent = `Trop de tentatives. Réessaie dans ${remain}s.`;
      return;
    }
    const val = $("#admin-pass").value || "";
    let hash;
    try { hash = await sha256(val); }
    catch(err){ if(errEl) errEl.textContent = "Erreur crypto — navigateur non compatible."; return; }
    if(hash === ADMIN_PASSWORD_HASH){
      loginFailedAttempts = 0;
      isAdmin = true;
      render();
      return;
    }
    loginFailedAttempts++;
    const remaining = LOGIN_MAX_TRIES - loginFailedAttempts;
    if(remaining <= 0){
      loginLockedUntil = Date.now() + LOGIN_LOCKOUT_MS;
      loginFailedAttempts = 0;
      if(errEl) errEl.textContent = `Trop d'essais. Verrouillé ${Math.round(LOGIN_LOCKOUT_MS/60000)} min.`;
    } else {
      if(errEl) errEl.textContent = `Mot de passe incorrect. ${remaining} essai${remaining>1?'s':''} restant${remaining>1?'s':''}.`;
    }
  });
  $("#admin-pass")?.addEventListener("keydown", e=>{ if(e.key==="Enter") $("#admin-login").click(); });
  $("#admin-logout")?.addEventListener("click", ()=>{ isAdmin = false; render(); });

  $$("[data-approve]").forEach(el=>{
    el.addEventListener("click", async ()=>{
      const p = findPerson(el.dataset.approve);
      if(p){
        p.status = "approved";
        revealPlaceholdersFor(p.id);
      }
      await savePeople(); render();
    });
  });
  $$("[data-reject]").forEach(el=>{
    el.addEventListener("click", async ()=>{
      if(!confirm("Rejeter cette demande ? La fiche sera définitivement supprimée.")) return;
      const id = el.dataset.reject;
      cleanupPlaceholdersForRejected(id);
      people = people.filter(p=>p.id !== id);
      await savePeople(); render();
    });
  });
  $$("[data-delete-person]").forEach(el=>{
    el.addEventListener("click", async ()=>{
      if(!confirm("Supprimer cette fiche ? Ses filleuls deviendront racines de leur propre branche.")) return;
      const id = el.dataset.deletePerson;
      people = people.filter(p=>p.id !== id);
      people.forEach(p=>{ if(Array.isArray(p.parrainIds)) p.parrainIds = p.parrainIds.filter(pid=>pid!==id); });
      await savePeople(); render();
    });
  });
  $$("[data-edit-person]").forEach(el=>{
    el.addEventListener("click", ()=>{ editingId = el.dataset.editPerson; render(); });
  });
  $("#close-edit")?.addEventListener("click", ()=>{ editingId=null; render(); });
  $("#edit-modal-backdrop")?.addEventListener("click", (e)=>{ if(e.target.id==="edit-modal-backdrop"){ editingId=null; render(); } });
  $("#save-edit")?.addEventListener("click", async ()=>{
    const p = findPerson(editingId);
    if(!p) return;
    p.prenom = $("#edit-prenom").value.trim();
    p.nom = $("#edit-nom").value.trim();
    p.level = $("#edit-level").value;
    p.anneeDiplome = $("#edit-annee").value;
    const editedFiliere = $("#edit-filiere")?.value || "";
    p.filiere = FILIERES.includes(editedFiliere) ? editedFiliere : "";
    const selectedParrainIds = Array.from($("#edit-parrain").selectedOptions).map(o=>o.value);
    // On garde l'ordre existant pour les parrains déjà présents (celui en position 0
    // reste le parrain "principal", donc sa position dans l'arbre ne bouge pas) et on
    // ajoute les nouveaux à la fin.
    const keptInOrder = parrainIdsOf(p).filter(id => selectedParrainIds.includes(id));
    const newlyAdded = selectedParrainIds.filter(id => !keptInOrder.includes(id));
    p.parrainIds = [...keptInOrder, ...newlyAdded];
    editingId = null;
    await savePeople(); render();
  });
}

// tabs + modal close (delegated once)
document.addEventListener("click", (e)=>{
  const tabBtn = e.target.closest("[data-tab]");
  if(tabBtn){ currentTab = tabBtn.dataset.tab; if(currentTab==='rejoindre' && !joinForm) joinForm = blankJoinForm(); render(); return; }
  if(e.target.closest("[data-close-modal]")) closeModal();
});
