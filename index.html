<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbre des familles — ISFA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2B39;
    --ink-2:#3B4E5E;
    --paper:#F1EEE4;
    --paper-2:#E7E1D0;
    --amber:#C68A34;
    --amber-dark:#96691F;
    --green:#3F6C4E;
    --green-bg:#E4ECE4;
    --rust:#B5533B;
    --rust-bg:#F3E2DC;
    --line:#D9D3C3;
    --white:#FBFAF6;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3,h4{
    font-family:'Fraunces',serif;
    font-weight:600;
    margin:0;
    color:var(--ink);
  }
  a{color:var(--amber-dark);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}

  #app{max-width:1100px;margin:0 auto;padding:0 20px 80px;}

  .topbar{
    display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
    padding:32px 0 0;
    border-bottom:1px solid var(--line);
    margin-bottom:28px;
    gap:16px;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{
    width:44px;height:44px;border-radius:50%;
    background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:16px;
    flex-shrink:0;
  }
  .brand h1{font-size:22px;letter-spacing:-0.01em;}
  .brand p{margin:2px 0 0;font-size:13px;color:var(--ink-2);}

  .tabs{display:flex;gap:22px;padding-bottom:14px;}
  .tab{
    background:none;border:none;padding:6px 0;
    font-size:14px;color:var(--ink-2);
    border-bottom:2px solid transparent;
    transition:color .15s;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--ink);border-bottom-color:var(--amber);font-weight:600;}

  .panel{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px;
    margin-bottom:20px;
  }
  .intro{font-size:13.5px;color:var(--ink-2);margin:0 0 18px;max-width:66ch;}
  .intro strong{color:var(--ink);}

  .badge{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:34px;height:22px;padding:0 7px;
    border-radius:11px;font-size:11.5px;font-weight:600;
    background:var(--paper-2);color:var(--ink-2);
    border:1px solid var(--line);
  }
  .badge.b1A{background:#EFE0C4;color:#7A5316;border-color:#DEC896;}
  .badge.b2A{background:#E3E8D6;color:#4B6B2E;border-color:#CBD6B4;}
  .badge.b3A{background:#DCE6E6;color:#2E6363;border-color:#BFD4D4;}
  .badge.b4A{background:#DDE1EE;color:#3A4A8C;border-color:#C4CBE6;}
  .badge.b5A{background:#EBDDE8;color:#733D6B;border-color:#DBC3D5;}
  .badge.bDiplome{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .badge.bAlumni{background:#4A3B5C;color:var(--paper);border-color:#4A3B5C;}

  .pill{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:11px;
  }
  .pill.pending{background:var(--rust-bg);color:var(--rust);}
  .pill.approved{background:var(--green-bg);color:var(--green);}
  .pill.placeholder{background:#EDEAE0;color:var(--ink-2);border:1px dashed var(--line);}

  /* Tree toolbar */
  .tree-controls{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    margin-bottom:14px;
  }
  .tree-controls input[type=text]{
    flex:1;min-width:200px;padding:9px 11px;
    border:1px solid var(--line);border-radius:var(--radius);background:var(--white);
  }
  .tree-zoom{
    display:inline-flex;align-items:center;gap:4px;
    border:1px solid var(--line);border-radius:var(--radius);
    padding:2px 4px;background:var(--white);
  }
  .tree-zoom .btn{padding:4px 10px;}
  .tree-zoom-value{font-size:12.5px;color:var(--ink-2);min-width:44px;text-align:center;}
  .tree-info{font-size:12px;color:var(--ink-2);margin-left:auto;}

  /* Tree */
  .tree-legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;font-size:12.5px;color:var(--ink-2);align-items:center;}
  .tree-legend span{display:inline-flex;align-items:center;gap:6px;}
  .tree-svg-wrap{
    overflow:auto;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--paper);padding:14px;
    max-height:75vh;
    position:relative;
  }
  .tree-link{stroke:var(--line);stroke-width:1.5;fill:none;}
  .tree-link.dim{stroke:#E8E3D3;}
  .tree-link-extra{stroke:var(--amber);stroke-width:1.5;fill:none;stroke-dasharray:5 3;opacity:.8;}
  .tree-link-extra.dim{stroke:#EAD9B8;opacity:.35;}
  .tree-row-divider{stroke:var(--line);stroke-width:1;stroke-dasharray:2 5;}
  .tree-card{
    width:100%;height:100%;box-sizing:border-box;
    display:flex;flex-direction:column;justify-content:center;gap:4px;
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
    padding:8px 10px;font-family:'Inter',sans-serif;
    transition:opacity .15s, box-shadow .15s, border-color .15s;
  }
  .tree-card-placeholder{border-style:dashed;background:var(--paper-2);}
  .tree-card-main{display:flex;align-items:center;gap:7px;cursor:pointer;overflow:hidden;}
  .tree-card-main:hover .tree-card-name{color:var(--amber-dark);}
  .tree-card-name{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .12s;}
  .tree-card-name.placeholder-name{font-style:italic;font-weight:500;color:var(--ink-2);}
  .tree-card-match{border-color:var(--amber);box-shadow:0 0 0 2px rgba(198,138,52,.35);}
  .tree-card-dim{opacity:.28;}
  .tree-toggle{
    align-self:flex-start;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);
    font-size:10.5px;padding:1px 7px;border-radius:10px;
  }
  .tree-toggle:hover{background:var(--paper-2);color:var(--ink);}
  .node-meta{font-size:12px;color:var(--ink-2);}

  .empty{
    text-align:center;padding:50px 20px;color:var(--ink-2);font-size:14px;
  }

  /* Directory */
  .dir-controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  .dir-controls input, .dir-controls select{
    padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);
  }
  .dir-controls input{flex:1;min-width:180px;}
  .dir-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 10px;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .dir-row:hover{background:var(--paper);}
  .dir-row:last-child{border-bottom:none;}
  .dir-left{display:flex;align-items:center;gap:12px;}
  .dir-name{font-weight:600;}
  .dir-sub{font-size:12.5px;color:var(--ink-2);}

  /* Forms */
  .form-section{margin-bottom:22px;}
  .form-section h3{font-size:15px;margin-bottom:4px;}
  .form-section .hint{font-size:12.5px;color:var(--ink-2);margin:0 0 12px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px;}
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--white);color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:600px){.row2{grid-template-columns:1fr;}}
  .checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;}
  .checkline input{width:auto;}

  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:10px 16px;border-radius:var(--radius);border:1px solid var(--ink);
    background:var(--ink);color:var(--paper);font-size:13.5px;font-weight:600;
    transition:opacity .12s;
  }
  .btn:hover{opacity:.88;}
  .btn.secondary{background:transparent;color:var(--ink);border-color:var(--line);}
  .btn.danger{background:var(--rust);border-color:var(--rust);}
  .btn.small{padding:6px 11px;font-size:12.5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .exp-card{
    border:1px solid var(--line);border-radius:var(--radius);padding:13px;margin-bottom:10px;background:var(--paper);
  }
  .exp-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}

  .search-picker{border:1px solid var(--line);border-radius:var(--radius);max-height:180px;overflow-y:auto;margin-top:6px;}
  .search-picker-item{padding:8px 11px;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--line);}
  .search-picker-item:last-child{border-bottom:none;}
  .search-picker-item:hover{background:var(--paper);}
  .parrain-chosen{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 12px;border:1px solid var(--amber);background:#FBF3E5;border-radius:var(--radius);font-size:13.5px;
  }

  .warning-box{
    border:1px solid var(--rust);background:var(--rust-bg);color:var(--rust);
    padding:10px 13px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;
  }
  .success-box{
    border:1px solid var(--green);background:var(--green-bg);color:var(--green);
    padding:14px 16px;border-radius:var(--radius);font-size:13.5px;margin-bottom:14px;
  }
  .error-text{color:var(--rust);font-size:12px;margin-top:4px;}

  .filleul-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .filleul-row input{flex:1;}

  /* Modal */
  #modal-root{position:fixed;inset:0;z-index:50;display:none;}
  #modal-root.open{display:block;}
  .modal-backdrop{position:absolute;inset:0;background:rgba(28,43,57,.55);}
  .modal-box{
    position:relative;max-width:560px;margin:60px auto;background:var(--white);
    border-radius:var(--radius);padding:26px;max-height:80vh;overflow-y:auto;
  }
  .modal-close{position:absolute;top:18px;right:18px;background:none;border:none;font-size:20px;color:var(--ink-2);}
  .modal-title{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .modal-sub{font-size:12.5px;color:var(--ink-2);margin-bottom:18px;}
  .modal-block{margin-bottom:16px;}
  .modal-block h4{font-size:12.5px;text-transform:none;color:var(--ink-2);font-weight:600;margin-bottom:8px;letter-spacing:.01em;}
  .exp-view{padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;}
  .exp-view:first-of-type{border-top:none;}
  .exp-view .role{font-weight:600;}
  .exp-view .meta{color:var(--ink-2);font-size:12.5px;}
  .locked-note{font-size:12px;color:var(--ink-2);font-style:italic;}

  .admin-gate{max-width:340px;margin:40px auto;text-align:center;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:22px;}
  .stat-card{border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center;}
  .stat-card .num{font-family:'Fraunces',serif;font-size:24px;font-weight:600;}
  .stat-card .lbl{font-size:11.5px;color:var(--ink-2);}

  .admin-item{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
  .admin-item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .admin-actions{display:flex;gap:8px;margin-top:10px;}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
</style>
<script src=https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js></script>
<script src=https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">ISFA</div>
      <div>
        <h1>Arbre des familles</h1>
        <p>ISFA — parrainages &amp; réseau des ancien</p>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"></main>
</div>
<div id="modal-root"></div>

<script>
(function(){
'use strict';

// --- Frein anti-copie (PAS une vraie protection) --------------------------
// Ceci désactive le clic droit et quelques raccourcis clavier courants pour
// décourager le survol occasionnel. Ça n'empêche PAS réellement de voir le
// code source : n'importe qui peut toujours taper "view-source:" devant
// l'URL, ouvrir les outils développeur depuis le menu du navigateur, ou
// récupérer le fichier directement depuis le réseau. Ne pas compter dessus
// pour protéger des données sensibles (le mot de passe admin, lui, est déjà
// haché — voir ADMIN_PASSWORD_HASH plus bas — mais tout le reste du code
// JS reste lisible par quiconque le veut vraiment).
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("keydown", e => {
  const k = e.key;
  const blocked =
    k === "F12" ||
    ((e.ctrlKey || e.metaKey) && e.shiftKey && ["I","J","C"].includes(k.toUpperCase())) ||
    ((e.ctrlKey || e.metaKey) && k.toUpperCase() === "U");
  if(blocked) e.preventDefault();
});

const ADMIN_PASSWORD_HASH = "26168ca5e7220b91e8f4be6474bfbd7c70c5f44dc3b0af484fb2fcdf2b15ef9d";
const LOGIN_MAX_TRIES = 5;
const LOGIN_LOCKOUT_MS = 5 * 60 * 1000;
const SUBMIT_MIN_INTERVAL_MS = 10 * 1000;
const MAX_EXPERIENCES = 20;
const MAX_FILLEULS_DECLARES = 30;
const STORE_KEY = "isfa_arbre_people_v1";
// Import the functions you need from the SDKs you need

// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCRd5RDzYnLhxVDxHhxuCIMNZoi3fBbdiY",
  authDomain: "arbre-isfa.firebaseapp.com",
  projectId: "arbre-isfa",
  storageBucket: "arbre-isfa.firebasestorage.app",
  messagingSenderId: "865276001825",
  appId: "1:865276001825:web:369e3237d107ea38eead60"
};

// Initialize Firebase
// Initialize Firebase
firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const peopleCol = db.collection("people");
const LEVELS = ["1A","2A","3A","4A","5A","Diplômé"];
const FILIERES = ["Actuariat","Éco-stat","PME-PMI"];
const EXP_TYPES = ["Stage","Alternance","CDI","CDD","Autre"];
const NAME_RE = /^[A-Za-zÀ-ÖØ-öø-ÿ' -]{2,40}$/;
const VALID_STATUSES = ["approved","pending","placeholder","placeholder_pending","rejected"];

/* =========================================================================
   STATE
   ========================================================================= */
let people = [];
let currentTab = "arbre";
let isAdmin = false;
let dirQuery = "";
let dirLevel = "";
let dirFiliere = "";
let joinForm = null; // working object for the join form
let editingId = null; // admin editing an existing person
let collapsedIds = new Set(); // branches repliées dans l'onglet Arbre
let treeSearch = "";
let treeZoom = 1;
let _levelCache = new Map(); // cache par render pour effectiveLevelInfo
let loginFailedAttempts = 0;
let loginLockedUntil = 0;
let lastSubmitAt = 0;

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
function esc(str){
  return String(str ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function uid(){ return 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
async function sha256(text){
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function isValidPersonRecord(p){
  return p && typeof p === "object"
    && typeof p.id === "string" && p.id.length > 0 && p.id.length < 100
    && typeof p.prenom === "string" && p.prenom.length < 60
    && typeof p.nom === "string" && p.nom.length < 60
    && typeof p.level === "string" && LEVELS.includes(p.level)
    && typeof p.status === "string" && VALID_STATUSES.includes(p.status)
    && (p.parrainIds === undefined || Array.isArray(p.parrainIds))
    && (p.parrainId === undefined || p.parrainId === null || typeof p.parrainId === "string")
    && (p.pendingSourceIds === undefined || Array.isArray(p.pendingSourceIds));
}

/* =========================================================================
   STORAGE
   ========================================================================= */
   async function loadPeople(){
  try{
    const snap = await peopleCol.get();
    const raw = snap.docs.map(d => d.data());
    people = raw.filter(isValidPersonRecord).map(migratePersonRecord);
  }catch(e){
    console.error("Firestore load error:", e);
    people = [];
  }
}

// Ancien format : un seul champ "parrainId" (string|null).
// Nouveau format : "parrainIds" (tableau), pour permettre plusieurs parrains.
// Cette fonction convertit les vieilles fiches à la volée, sans casser les données existantes.
function migratePersonRecord(p){
  if(!Array.isArray(p.parrainIds)){
    p.parrainIds = p.parrainId ? [p.parrainId] : [];
  }
  return p;
}




async function savePeople(){
  try{
    // Un doc par personne, id du doc = id de la personne. Batch pour l'atomicité.
    const batch = db.batch();
    const snap = await peopleCol.get();
    const existingIds = new Set(snap.docs.map(d => d.id));
    const currentIds = new Set(people.map(p => p.id));
    people.forEach(p => batch.set(peopleCol.doc(p.id), p));
    existingIds.forEach(id => { if(!currentIds.has(id)) batch.delete(peopleCol.doc(id)); });
    await batch.commit();
  }catch(e){
    console.error("Firestore save error:", e);
    alert("Erreur d'enregistrement (Firestore). Réessaie dans un instant.");
  }
}

/* =========================================================================
   HELPERS
   ========================================================================= */
function levelBadgeClass(level){
  if(level === "Diplômé") return "bDiplome";
  return "b" + level;
}
function approvedPeople(){ return people.filter(p => p.status === "approved"); }
function pendingPeople(){ return people.filter(p => p.status === "pending"); }
// Inclut aussi les placeholders "en attente" (créés via une fiche pas encore validée
// par l'admin) : l'admin doit pouvoir les voir, même s'ils ne sont pas encore dans l'arbre.
function placeholderPeople(){ return people.filter(p => p.status === "placeholder" || p.status === "placeholder_pending"); }
// Seuls les statuts "approved" et "placeholder" (confirmé) apparaissent dans l'arbre.
// "placeholder_pending" reste invisible tant que la fiche qui l'a fait naître n'est
// pas validée par l'admin.
function visiblePeople(){ return people.filter(p => p.status === "approved" || p.status === "placeholder"); }
function findPerson(id){ return people.find(p => p.id === id); }
function fullName(p){ return `${p.prenom} ${p.nom}`; }
// Une personne peut avoir plusieurs parrains : parrainIds est un tableau.
function parrainIdsOf(p){ return Array.isArray(p.parrainIds) ? p.parrainIds : []; }
function parrainsOf(p){ return parrainIdsOf(p).map(findPerson).filter(Boolean); }
// Seuls les liens qui pointent vers une personne qui existe encore comptent pour dire
// si quelqu'un a "un parrain" (au cas où une fiche a été supprimée entretemps).
function validParrainIds(p){ return parrainIdsOf(p).filter(id => findPerson(id)); }
function addParrainId(person, parrainId){
  if(!parrainId) return;
  if(!Array.isArray(person.parrainIds)) person.parrainIds = [];
  if(!person.parrainIds.includes(parrainId)) person.parrainIds.push(parrainId);
}
function childrenOf(id){
  return visiblePeople().filter(p => parrainIdsOf(p).includes(id))
    .sort((a,b)=> fullName(a).localeCompare(fullName(b)));
}
function roots(){
  return visiblePeople().filter(p => validParrainIds(p).length === 0)
    .sort((a,b)=> fullName(a).localeCompare(fullName(b)));
}
// Le "parrain principal" détermine la position d'une personne dans l'arbre (une seule
// case par personne). C'est le premier parrain valide de la liste — en pratique celui
// choisi au moment de l'inscription, donc sa branche ne bouge jamais quand un parrain
// supplémentaire est ajouté ensuite par quelqu'un d'autre.
function primaryParrainId(p){
  const valid = validParrainIds(p);
  return valid.length ? valid[0] : null;
}
// Enfants "principaux" au sens de l'arbre : ceux dont CETTE personne est le parrain
// principal. Sert uniquement à construire la structure de l'arbre (une case par
// personne) ; childrenOf() ci-dessus reste utilisé partout ailleurs pour lister TOUS
// les filleuls (y compris via un parrainage secondaire).
function primaryChildrenOf(id){
  return visiblePeople().filter(p => primaryParrainId(p) === id)
    .sort((a,b)=> fullName(a).localeCompare(fullName(b)));
}

// Niveau effectif : un Diplômé qui parraine un 5A devient "6A", son propre parrain "7A", etc.
// Non-Diplômé garde son niveau stocké. Diplômé sans filleul reste "Diplômé".
function effectiveLevelInfo(person){
  if(!person) return { label:"?", badgeClass:"", promo:0 };
  if(_levelCache.has(person.id)) return _levelCache.get(person.id);
  // guard contre boucle éventuelle (parrainId qui pointe sur soi-même par erreur)
  _levelCache.set(person.id, { label: person.level, badgeClass: levelBadgeClass(person.level), promo: parseInt(person.level,10) || 5 });
  let info;
  if(person.level !== "Diplômé"){
    const n = parseInt(person.level,10); // "1A" -> 1
    info = { label: person.level, badgeClass: levelBadgeClass(person.level), promo: n };
  } else {
    const kids = childrenOf(person.id);
    if(kids.length === 0){
      info = { label: "Diplômé", badgeClass: "bDiplome", promo: 5 };
    } else {
      let maxPromo = 0;
      kids.forEach(k => {
        const kInfo = effectiveLevelInfo(k);
        if(kInfo.promo > maxPromo) maxPromo = kInfo.promo;
      });
      const N = Math.max(6, maxPromo + 1);
      info = {
        label: N + "A",
        badgeClass: N <= 5 ? "b" + N + "A" : "bAlumni",
        promo: N
      };
    }
  }
  _levelCache.set(person.id, info);
  return info;
}

function nameTaken(prenom, nom, excludeId){
  const p1 = prenom.trim().toLowerCase(), n1 = nom.trim().toLowerCase();
  return people.some(p => p.id !== excludeId &&
    p.status !== "rejected" &&
    p.prenom.trim().toLowerCase() === p1 &&
    p.nom.trim().toLowerCase() === n1);
}
// filleuls déclarés par quelqu'un d'autre (status "placeholder") dont le nom correspond
function placeholderMatches(prenom, nom){
  const p1 = prenom.trim().toLowerCase(), n1 = nom.trim().toLowerCase();
  if(!p1 || !n1) return [];
  return placeholderPeople().filter(ph =>
    ph.prenom.trim().toLowerCase() === p1 && ph.nom.trim().toLowerCase() === n1);
}
// fiches déjà validées ou en attente (pas des placeholders) avec le même nom — doublon potentiel
function existingRealMatches(prenom, nom, excludeId){
  const p1 = prenom.trim().toLowerCase(), n1 = nom.trim().toLowerCase();
  if(!p1 || !n1) return [];
  return people.filter(p => p.id !== excludeId &&
    (p.status === "approved" || p.status === "pending") &&
    p.prenom.trim().toLowerCase() === p1 && p.nom.trim().toLowerCase() === n1);
}
